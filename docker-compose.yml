version: '3.8'

services:
  db:
    image: postgres:15
    container_name: reaseguro_db
    ports:
      - "5400:5432"
    environment:
      POSTGRES_DB: rocketcode_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
